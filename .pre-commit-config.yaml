repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-x, -s, bash]
        files: ^scripts/

  - repo: local
    hooks:
      # Pre-commit: format + test
      - id: gofmt
        name: Go format
        entry: gofmt -l -w
        language: system
        types: [go]

      - id: golangci-lint
        name: Go lint
        entry: bash scripts/lint-changed.sh
        language: system
        types: [go]
        require_serial: true

      - id: cloud-backend-isolation
        name: Cloud backend isolation check
        entry: bash scripts/check-cloud-backend-isolation.sh
        language: system
        types: [go]
        pass_filenames: false

      - id: no-public-cloud-services
        name: No public Cloud Run / GCF exposure
        entry: bash scripts/check-no-public-cloud-services.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: single-open-pr
        name: At most one PR open (put all work in the one open PR)
        entry: bash scripts/check-single-open-pr.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: simulator-testing-contract
        name: Simulator testing contract (SDK + CLI + terraform per change)
        entry: bash scripts/check-simulator-tests.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: behavioral-coverage
        name: AWS behavioral pattern coverage registry
        entry: bash scripts/check-behavioral-coverage.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: simulator-coverage-matrix
        name: Simulator SDK/CLI/Terraform coverage matrix
        entry: bash scripts/check-simulator-coverage-matrix.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: cli-shard-coverage
        name: AWS CLI shard coverage (every CLI test runs in exactly one CI shard)
        entry: bash scripts/check-cli-shard-coverage.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: port-defaults
        name: Port defaults (no :2375 / :9100 in production sources)
        entry: bash scripts/check-port-defaults.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: mux-overlap-scan
        name: Mux-overlap scan (warn mode; gating in Stage B)
        entry: bash scripts/scan-mux-overlap.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: casefold-slice
        name: No case-fold-then-index slice-bounds class (use sim.CaseInsensitiveIndex)
        entry: bash scripts/check-casefold-slice.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: locked-helpers
        name: No store-mutex acquisition inside *Locked helpers (RWMutex is not reentrant)
        entry: bash scripts/check-locked-helpers.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: no-tool-absent-skips
        name: No new skip-if-tool-absent tests
        entry: bash scripts/check-no-tool-absent-skips.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: go-test-core
        name: Go test (core)
        entry: bash -c 'cd backends/core && go test ./... -count=1 -timeout 120s'
        language: system
        pass_filenames: false
        always_run: true

      - id: go-test-api
        name: Go test (api — generated files + field coverage)
        entry: bash -c 'cd api && go test ./... -count=1 -timeout 30s'
        language: system
        pass_filenames: false
        always_run: true

      - id: ui-test-admin
        name: UI test (admin)
        entry: bash -c 'cd ui/packages/admin && npx vitest run 2>&1'
        language: system
        pass_filenames: false
        always_run: true

      # simulator code-quality: dead code + copy-paste detection
      - id: simulators-deadcode
        name: simulator dead code (deadcode aws/gcp/azure)
        entry: bash scripts/simulators-deadcode.sh
        language: system
        pass_filenames: false
        files: ^simulators/(aws|gcp|azure)/.*\.go$
        always_run: false

      - id: simulators-dupl
        name: simulator copy-paste Go (dupl ≥200 tokens)
        entry: bash scripts/simulators-dupl.sh
        language: system
        pass_filenames: false
        files: ^simulators/(aws|gcp|azure)/.*\.go$
        always_run: false

      - id: simulators-knip
        name: simulator dead TS exports (knip)
        entry: bash scripts/simulators-knip.sh
        language: system
        pass_filenames: false
        files: ^ui/packages/simulator-(aws|gcp|azure)/src/
        always_run: false

      - id: simulators-jscpd
        name: simulator copy-paste UI (jscpd ≥200 tokens)
        entry: bash scripts/simulators-jscpd.sh
        language: system
        pass_filenames: false
        files: ^ui/packages/simulator-(aws|gcp|azure)/src/
        always_run: false

      # Commit-msg: strip AI attribution
      - id: strip-ai-attribution
        name: Strip AI attribution from commit messages
        entry: bash scripts/strip-ai-attribution.sh
        language: system
        stages: [commit-msg]
        always_run: true

      # Pre-push: check rebase + update badges
      - id: rebased-on-main
        name: Branch rebased on origin/main
        entry: bash scripts/check-rebased-on-main.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: shellcheck-scripts-all
        name: ShellCheck all scripts
        entry: bash -c 'shellcheck -x -s bash scripts/*.sh'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: shell-syntax-scripts-all
        name: Shell syntax all scripts (bash + zsh)
        entry: bash -c 'bash -n scripts/*.sh && zsh -n scripts/*.sh'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: update-readme-badges
        name: Update README badges
        entry: bash scripts/update-readme-badges.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: check-latest-deps
        name: Check Go modules + Terraform providers are on latest versions
        entry: bash scripts/check-latest-deps.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
