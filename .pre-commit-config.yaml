# Hooks without an explicit `stages:` would otherwise run in EVERY installed
# stage — re-executing the whole always_run suite (Go tests, UI tests) a second
# time during the commit-msg stage of each commit, with file-scoped hooks
# misleadingly reporting "no files to check". Scope the default to pre-commit;
# hooks that belong elsewhere declare their stage explicitly.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-x, -s, bash]
        files: ^(scripts/|ui/packages/(admin|core)/e2e/).*\.sh$

  - repo: local
    hooks:
      # Pre-commit: format + test
      - id: gofmt
        name: Go format
        entry: gofmt -l -w
        language: system
        types: [go]

      - id: golangci-lint
        name: Go lint
        entry: bash scripts/lint-changed.sh
        language: system
        types: [go]
        require_serial: true

      - id: cloud-backend-isolation
        name: Cloud backend isolation check
        entry: bash scripts/check-cloud-backend-isolation.sh
        language: system
        types: [go]
        pass_filenames: false

      - id: no-public-cloud-services
        name: No public Cloud Run / GCF exposure
        entry: bash scripts/check-no-public-cloud-services.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: single-open-pr
        name: At most one PR open (put all work in the one open PR)
        entry: bash scripts/check-single-open-pr.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: port-defaults
        name: Port defaults (no :2375 / :9100 in production sources)
        entry: bash scripts/check-port-defaults.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: no-tool-absent-skips
        name: No new skip-if-tool-absent tests
        entry: bash scripts/check-no-tool-absent-skips.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: smoke-build-contexts
        name: Smoke Docker build contexts include shared modules
        entry: bash scripts/check-smoke-build-contexts.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: embedded-ui-build-order
        name: Embedded web interfaces build before Go binaries
        entry: bash scripts/check-embedded-ui-build-order.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: container-publication
        name: Immutable multi-architecture container publication contract
        entry: bash scripts/check-container-publication.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: workflow-timeouts
        name: GitHub Actions jobs finish within 15 minutes
        entry: bash -c 'scripts/test-workflow-timeouts.sh && scripts/check-workflow-timeouts.sh'
        language: system
        pass_filenames: false
        always_run: true

      - id: required-status-checks
        name: Required status checks stay emittable (no merge-queue drift)
        entry: bash scripts/check-required-status-checks.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: go-test-core
        name: Go test (core)
        entry: bash -c 'cd backends/core && go test ./... -count=1 -timeout 120s'
        language: system
        pass_filenames: false
        always_run: true

      - id: go-test-api
        name: Go test (api — generated files + field coverage)
        entry: bash -c 'cd api && go test ./... -count=1 -timeout 30s'
        language: system
        pass_filenames: false
        always_run: true

      - id: ui-test-admin
        name: UI test (admin)
        entry: bash -c 'cd ui/packages/admin && npx vitest run 2>&1'
        language: system
        pass_filenames: false
        always_run: true

      # Commit-msg: strip AI attribution
      - id: strip-ai-attribution
        name: Strip AI attribution from commit messages
        entry: bash scripts/strip-ai-attribution.sh
        language: system
        stages: [commit-msg]
        always_run: true

      # Pre-push: check rebase + update badges
      - id: rebased-on-main
        name: Branch rebased on origin/main
        entry: bash scripts/check-rebased-on-main.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: shellcheck-scripts-all
        name: ShellCheck all scripts
        entry: bash -c 'shellcheck -x -s bash scripts/*.sh ui/packages/admin/e2e/*.sh ui/packages/core/e2e/*.sh'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: shell-syntax-scripts-all
        name: Shell syntax all scripts (bash + zsh)
        entry: bash -c 'bash -n scripts/*.sh ui/packages/admin/e2e/*.sh ui/packages/core/e2e/*.sh && zsh -n scripts/*.sh ui/packages/admin/e2e/*.sh ui/packages/core/e2e/*.sh'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: update-readme-badges
        name: Update README badges
        entry: bash scripts/update-readme-badges.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: check-latest-deps
        name: Check Go modules + Terraform providers are on latest versions
        entry: bash scripts/check-latest-deps.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
