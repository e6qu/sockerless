name: CI

on:
  pull_request:
    branches: [main]
  # Reusable from release.yml so tag pushes get full PR-level CI.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.10.1
      - name: Lint
        run: make lint

  check-deps:
    name: check-deps (Go modules + Terraform providers on latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Install jq (curl already available)
        run: sudo apt-get install -y jq
      - name: Check dependency freshness
        run: bash scripts/check-latest-deps.sh

  # test-core: fast unit + library tests, no Docker integration.
  # Split out so flakes in per-backend integration don't restart the
  # whole 12-minute monolith. Runs ~3 minutes.
  test-core:
    name: test (core)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Architecture checks
        run: bash scripts/check-cloud-backend-isolation.sh
      - name: Core + API + agent
        run: |
          set -e
          run() { echo "=== $1 ===" && (cd "$1" && go test -tags noui -v -timeout 15m ./...); }
          run_noflags() { echo "=== $1 ===" && (cd "$1" && go test -v -timeout 15m ./...); }
          run_race() { echo "=== $1 ===" && (cd "$1" && go test -v -race -timeout 15m ./...); }
          run_work() { echo "=== $1 ===" && (cd "$1" && GOWORK=off go test -v -timeout 2m ./...); }
          run_noflags api
          run backends/core
          run_race agent
          run backends/aws-common
          run backends/gcp-common
          run backends/azure-common
          run bleephub
          run cmd/sockerless-admin
          run_work simulators/aws/shared
          run_work simulators/gcp/shared
          run_work simulators/azure/shared

  # test-backend: per-backend matrix. Each job runs one backend's
  # integration tests (TestMain spawns sim + backend, exercises Docker).
  # Matrix isolates flakes to one job — re-run individual backend
  # without restarting the others. FaaS smoke tests are skipped here
  # (`-skip FaaSE2ESmoke`) — they run in `test-faas-smoke` below.
  test-backend:
    name: test (${{ matrix.backend }})
    runs-on: ubuntu-24.04-arm
    env:
      SOCKERLESS_TEST_TARGET: "sim"
    strategy:
      fail-fast: false
      matrix:
        backend: [ecs, lambda, cloudrun, cloudrun-functions, aca, azure-functions]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Verify docker available
        run: docker version && docker info
      - name: Integration tests for ${{ matrix.backend }}
        run: |
          set -e
          cd "backends/${{ matrix.backend }}"
          # ECS doesn't have FaaS smoke tests; skip flag is a no-op there.
          go test -tags noui -v -skip 'FaaSE2ESmoke' -timeout 15m ./...

  # test-faas-smoke: per-backend FaaS smoke matrix. These tests
  # exercise the runner-shaped lifecycle (create → start → exec×N →
  # signal → wait → remove). Isolated to their own jobs so
  # signal-timing flakes don't restart the unit suite.
  test-faas-smoke:
    name: test (${{ matrix.backend }} faas-smoke)
    runs-on: ubuntu-24.04-arm
    env:
      SOCKERLESS_TEST_TARGET: "sim"
    strategy:
      fail-fast: false
      matrix:
        backend: [lambda, cloudrun, gcf, aca, azf]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Verify docker available
        run: docker version && docker info
      - name: FaaS smoke for ${{ matrix.backend }}
        run: make faas-smoke-test-${{ matrix.backend }}

  test-e2e:
    # Native linux/arm64 — same rationale as `test`.
    runs-on: ubuntu-24.04-arm
    name: test (e2e)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Run tests
        run: cd tests && go test -v -timeout 5m ./...

  sim:
    # Native linux/arm64 runner — matches the sim's primary capacity
    # contract (Apple Silicon dev hosts also arm64). No QEMU.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure]
    name: sim (${{ matrix.cloud }})
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Install gcloud CLI
        if: matrix.cloud == 'gcp'
        run: |
          curl -sSL https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-arm.tar.gz | tar -xz -C $HOME
          echo "$HOME/google-cloud-sdk/bin" >> $GITHUB_PATH
      - name: Install Azure CLI
        if: matrix.cloud == 'azure'
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Run SDK tests
        run: cd simulators/${{ matrix.cloud }} && make sdk-test
        # Native arm64 — workloads run without emulation; 10min covers
        # image build + container start.
        timeout-minutes: 10
        env:
          GOWORK: "off"
      - name: Run CLI tests
        run: cd simulators/${{ matrix.cloud }} && make cli-test
        timeout-minutes: 10
        env:
          GOWORK: "off"

  tf:
    # Stock hashicorp/aws / hashicorp/google / hashicorp/azurerm
    # providers run against the sim binary via `terraform init` +
    # `terraform apply -auto-approve`. Exercises the provider's
    # call-sequence shape, which differs materially from the SDK's
    # (every recent reopen — BUG-1098 / 1099 / 1142 / 1147 — surfaced
    # against a provider sequence that the SDK tests had already
    # marked green).
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure]
    name: tf (${{ matrix.cloud }})
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - uses: hashicorp/setup-terraform@v4
      - name: Run terraform tests
        run: cd simulators/${{ matrix.cloud }} && make terraform-test
        timeout-minutes: 10
        env:
          GOWORK: "off"

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - run: cd ui && bun install --frozen-lockfile
      - run: cd ui && bunx turbo run build
      - run: cd ui && bunx turbo run test

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Check backend api.Backend coverage
        run: cd tools/check-backend-coverage && GOWORK=off go run . --enforce
      - name: Check simulator SDK/CLI/Terraform coverage matrix
        run: bash scripts/check-simulator-coverage-matrix.sh
      - name: Build all binaries (amd64)
        env:
          GOWORK: "off"
        run: |
          set -e
          build() { echo "=== $1 ===" && (cd "$1" && go build -o /dev/null "$2"); }
          noui() { echo "=== $1 (noui) ===" && (cd "$1" && go build -tags noui -o /dev/null "$2"); }
          noui bleephub ./cmd
          build cmd/sockerless .
          build agent ./cmd/sockerless-agent
          noui backends/ecs ./cmd/sockerless-backend-ecs
          noui backends/lambda ./cmd/sockerless-backend-lambda
          noui backends/cloudrun ./cmd/sockerless-backend-cloudrun
          noui backends/cloudrun-functions ./cmd/sockerless-backend-gcf
          noui backends/aca ./cmd/sockerless-backend-aca
          noui backends/azure-functions ./cmd/sockerless-backend-azf
          noui backends/docker ./cmd
          noui simulators/aws .
          noui simulators/gcp .
          noui simulators/azure .
          noui cmd/sockerless-admin .
          build github-runner-dispatcher-aws ./cmd/github-runner-dispatcher-aws
          build github-runner-dispatcher-gcp ./cmd/github-runner-dispatcher-gcp
          build github-runner-dispatcher-azure ./cmd/github-runner-dispatcher-azure
      - name: Cross-compile all binaries (arm64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          set -e
          build() { echo "=== $1 ===" && (cd "$1" && go build -o /dev/null "$2"); }
          noui() { echo "=== $1 (noui) ===" && (cd "$1" && go build -tags noui -o /dev/null "$2"); }
          noui bleephub ./cmd
          build cmd/sockerless .
          build agent ./cmd/sockerless-agent
          noui backends/ecs ./cmd/sockerless-backend-ecs
          noui backends/lambda ./cmd/sockerless-backend-lambda
          noui backends/cloudrun ./cmd/sockerless-backend-cloudrun
          noui backends/cloudrun-functions ./cmd/sockerless-backend-gcf
          noui backends/aca ./cmd/sockerless-backend-aca
          noui backends/azure-functions ./cmd/sockerless-backend-azf
          noui backends/docker ./cmd
          noui simulators/aws .
          noui simulators/gcp .
          noui simulators/azure .
          noui cmd/sockerless-admin .
          build github-runner-dispatcher-aws ./cmd/github-runner-dispatcher-aws
          build github-runner-dispatcher-gcp ./cmd/github-runner-dispatcher-gcp
          build github-runner-dispatcher-azure ./cmd/github-runner-dispatcher-azure

  smoke:
    # Native linux/arm64 — sim's primary capacity (Phase 135b).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Smoke test (ecs)
        run: |
          docker build -t smoke-ecs -f smoke-tests/Dockerfile.ecs .
          docker run --rm --security-opt label=disable -v /var/run/docker.sock:/var/run/docker.sock smoke-ecs
        timeout-minutes: 10
      - name: Smoke test (cloudrun)
        run: |
          docker build -t smoke-cloudrun -f smoke-tests/Dockerfile.cloudrun .
          docker run --rm --security-opt label=disable -v /var/run/docker.sock:/var/run/docker.sock smoke-cloudrun
        timeout-minutes: 10
      - name: Smoke test (aca)
        run: |
          docker build -t smoke-aca -f smoke-tests/Dockerfile.aca .
          docker run --rm --security-opt label=disable -v /var/run/docker.sock:/var/run/docker.sock smoke-aca
        timeout-minutes: 10

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - uses: hashicorp/setup-terraform@v4
      - name: Run terraform tests
        run: |
          cd terraform/modules/ecs/test
          GOWORK=off go test -v -timeout 10m ./...
        timeout-minutes: 10
