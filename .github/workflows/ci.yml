name: CI

env:
  FIRECRACKER_VERSION: v1.15.1
  GO_CACHE_DEPENDENCY_PATHS: |
    go.work
    **/go.sum

on:
  pull_request:
    branches: [main]
  # Reusable from release.yml so tag pushes get full PR-level CI.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint-go:
    name: lint (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core-local
            modules: cmd/sockerless cmd/sockerless-admin agent bleephub bleeplab backends/docker
          - shard: cloud-backends-aws
            modules: backends/aws-common backends/ecs backends/lambda
          - shard: cloud-backends-gcp
            modules: backends/cloudrun backends/cloudrun-functions
          - shard: cloud-backends-azure
            modules: backends/aca backends/azure-functions
          - shard: simulators
            modules: simulators/aws simulators/gcp simulators/azure simulators/realexec
          - shard: dispatchers
            modules: github-runner-dispatcher-aws github-runner-dispatcher-gcp github-runner-dispatcher-azure
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
      - name: Lint
        run: |
          set -e
          for module in ${{ matrix.modules }}; do
            echo "=== $module ==="
            make "$module/lint"
          done
        timeout-minutes: 5

  check-deps:
    name: check-deps (deps + actions + scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Install script check tools
        run: bash scripts/ci-apt-update.sh && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y jq shellcheck zsh
      - name: Check shell scripts
        run: |
          shellcheck -x -s bash scripts/*.sh
          bash -n scripts/*.sh
          zsh -n scripts/*.sh
      - name: Check dependency freshness (bash)
        run: bash scripts/check-latest-deps.sh
      - name: Check dependency freshness (zsh)
        run: zsh scripts/check-latest-deps.sh
      # README badges are refreshed by the update-readme-badges pre-push hook.
      # Re-run it here so a push that skipped the hook (e.g. --no-verify) can't
      # land stale badges — the line counts are computed from committed files
      # (git ls-files + wc -l), so this is deterministic across platforms.
      - name: README badges are up to date
        run: |
          # The script exits non-zero when it refreshes badges; tolerate that
          # here and let the diff be the authority on staleness.
          bash scripts/update-readme-badges.sh || true
          if ! git diff --exit-code HEAD -- README.md; then
            echo "::error::README badges are stale. Run scripts/update-readme-badges.sh (or let the pre-push hook run — do not skip it) and commit README.md."
            exit 1
          fi

  # single-open-pr: enforce the one-PR rule — at most one PR open in the
  # project at a time. Fails (on every open PR) the moment a second is opened,
  # so all work goes into the single in-progress PR.
  single-open-pr:
    name: At most one PR open
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.0
      - name: At most one PR open
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-single-open-pr.sh

  # rebased-on-main: fail if the PR branch has fallen behind origin/main, so
  # every PR is tested (and merges) on top of the latest base.
  rebased-on-main:
    name: Branch rebased on origin/main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Branch must be rebased on origin/main
        run: bash scripts/check-rebased-on-main.sh

  # test-core: fast unit + library tests, no Docker integration.
  # Split out so flakes in per-backend integration don't restart the
  # whole 12-minute monolith. Runs ~3 minutes.
  test-core:
    name: test (core)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Architecture checks
        run: bash scripts/check-cloud-backend-isolation.sh
      - name: Core + API + agent
        run: |
          set -e
          run() { echo "=== $1 ===" && (cd "$1" && go test -tags noui -v -timeout 5m ./...); }
          run_noflags() { echo "=== $1 ===" && (cd "$1" && go test -v -timeout 5m ./...); }
          run_race() { echo "=== $1 ===" && (cd "$1" && go test -v -race -timeout 5m ./...); }
          run_work() { echo "=== $1 ===" && (cd "$1" && GOWORK=off go test -v -timeout 2m ./...); }
          run_noflags api
          run backends/core
          run_race agent
          run backends/aws-common
          run backends/gcp-common
          run backends/azure-common
          run bleephub
          run cmd/sockerless-admin
          run_work simulators/aws/shared
          run_work simulators/gcp/shared
          run_work simulators/azure/shared

  # test-backend: grouped backend integration tests. Each shard runs
  # real simulator-backed Docker integration tests for related backends.
  # FaaS smoke tests are skipped here (`-skip FaaSE2ESmoke`) and run
  # in `test-faas-smoke` below.
  test-backend:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      SOCKERLESS_TEST_TARGET: "sim"
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: aws backends
            backends: ecs lambda
          - shard: gcp backends
            backends: cloudrun cloudrun-functions
          - shard: azure backends
            backends: aca azure-functions
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Verify docker available
        run: docker version && docker info
      - name: Integration tests for ${{ matrix.shard }}
        run: |
          set -e
          for backend in ${{ matrix.backends }}; do
            echo "=== $backend ==="
            cd "backends/$backend"
            # ECS doesn't have FaaS smoke tests; skip flag is a no-op there.
            go test -tags 'noui integration' -v -skip 'FaaSE2ESmoke' -timeout 5m ./...
            cd ../..
          done

  # test-faas-smoke: grouped FaaS smoke matrix. These tests exercise
  # the runner-shaped lifecycle (create → start → exec×N → signal →
  # wait → remove) against real simulator-backed backends.
  test-faas-smoke:
    name: test (${{ matrix.shard }} faas-smoke)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      SOCKERLESS_TEST_TARGET: "sim"
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: aws-gcp
            backends: lambda cloudrun
          - shard: gcp-azure
            backends: gcf aca
          - shard: azure-functions
            backends: azf
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Verify docker available
        run: docker version && docker info
      - name: FaaS smoke for ${{ matrix.shard }}
        run: |
          set -e
          for backend in ${{ matrix.backends }}; do
            echo "=== $backend ==="
            make "faas-smoke-test-$backend"
          done

  test-e2e:
    # Native linux/arm64 CPU architecture, matching the simulator
    # capacity contract without QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    name: test (e2e)
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Run tests
        run: cd tests && go test -v -timeout 5m ./...

  firecracker:
    name: firecracker (microVM arithmetic)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/sockerless/firecracker-ci
          key: firecracker-ci-${{ env.FIRECRACKER_VERSION }}-${{ runner.arch }}
      - name: Install Firecracker test dependencies
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y curl e2fsprogs iproute2 iptables iputils-ping nftables openssh-client squashfs-tools
      - name: Install Firecracker
        run: bash scripts/install-firecracker.sh
      - name: Run Firecracker arithmetic smoke
        run: make firecracker-test
      - name: Run real-execution network/NIC smoke
        run: make realexec-network-test

  sim:
    # VM-backed simulator slices require /dev/kvm for real Firecracker guests.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cloud: [gcp, azure]
    name: sim (${{ matrix.cloud }})
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/sockerless/firecracker-ci
          key: firecracker-ci-${{ env.FIRECRACKER_VERSION }}-${{ runner.arch }}
      - name: Install gcloud CLI
        if: matrix.cloud == 'gcp'
        run: |
          archive="$RUNNER_TEMP/google-cloud-cli-linux-x86_64.tar.gz"
          curl --fail --location --show-error --silent --http1.1 \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            --output "$archive" \
            https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz
          tar -xzf "$archive" -C "$HOME"
          echo "$HOME/google-cloud-sdk/bin" >> "$GITHUB_PATH"
          # The Firestore-emulator component is the differential-test oracle for
          # TestFirestore_DifferentialVsEmulator (the runner ships a JRE).
          "$HOME/google-cloud-sdk/bin/gcloud" components install cloud-firestore-emulator beta --quiet
      - name: Install Azure CLI
        if: matrix.cloud == 'azure'
        run: az version
      - name: Install real-execution tools
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y curl e2fsprogs iproute2 iputils-ping nftables procps squashfs-tools
          bash scripts/install-firecracker.sh
      - name: Run module unit tests
        run: cd simulators/${{ matrix.cloud }} && GOWORK=off make unit-test
        timeout-minutes: 3
        env:
          GOWORK: "off"
      # Pre-pull the Cosmos DB emulator (the differential-test oracle for
      # TestCosmos_DifferentialVsEmulator). The differential checks the local
      # image store before running, so this is what makes it run for real.
      - name: Pull Cosmos DB emulator (differential oracle)
        if: matrix.cloud == 'azure'
        run: docker pull mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
        timeout-minutes: 8
      - name: Run SDK tests
        run: |
          bash scripts/ci-go-mod-download.sh simulators/${{ matrix.cloud }}
          cd simulators/${{ matrix.cloud }}
          sudo env "PATH=$PATH" "HOME=$HOME" GOWORK=off \
            SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/${{ matrix.cloud }}-spec-violations.jsonl" \
            SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/${{ matrix.cloud }}" \
            make sdk-test
        timeout-minutes: 12
        env:
          GOWORK: "off"
      - name: Run CLI tests
        run: |
          bash scripts/ci-go-mod-download.sh simulators/${{ matrix.cloud }}
          cd simulators/${{ matrix.cloud }}
          sudo env "PATH=$PATH" "HOME=$HOME" GOWORK=off \
            SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/${{ matrix.cloud }}-spec-violations.jsonl" \
            SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/${{ matrix.cloud }}" \
            make cli-test
        timeout-minutes: 12
        env:
          GOWORK: "off"
      - name: Spec-shape ratchet
        run: bash scripts/check-spec-violations.sh ${{ matrix.cloud }} "$RUNNER_TEMP/${{ matrix.cloud }}-spec-violations.jsonl"

  sim-aws-sdk:
    name: sim (aws sdk)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/sockerless/firecracker-ci
          key: firecracker-ci-${{ env.FIRECRACKER_VERSION }}-${{ runner.arch }}
      - name: Install real-execution tools
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y curl e2fsprogs iproute2 iputils-ping nftables procps squashfs-tools
          bash scripts/install-firecracker.sh
      - name: Run AWS module unit tests
        run: cd simulators/aws && GOWORK=off make unit-test
        timeout-minutes: 3
        env:
          GOWORK: "off"
      # Compile the sim binary + the (large, AWS-SDK-importing) SDK test binary
      # in a separate deterministic build step, so the timed test run below isn't
      # eaten by a cold recompile after an unrelated dep change busts the shared
      # **/go.sum Go cache. Build time gets its own budget; the test keeps a
      # tight one.
      - name: Pre-build AWS SDK tests (warm build cache)
        run: |
          bash scripts/ci-go-mod-download.sh simulators/aws
          cd simulators/aws && make build
          cd sdk-tests && GOWORK=off CGO_ENABLED=0 go test -c -o /tmp/aws-sdk-tests.test .
        timeout-minutes: 6
        env:
          GOWORK: "off"
      # Pre-pull the DynamoDB Local differential oracle so the timed test run
      # below doesn't spend its budget on the image fetch (the differential test
      # checks the local image store before pulling). DynamoDB Local is the
      # reference oracle for the TestDynamoDB_DifferentialVsLocal sweep.
      - name: Pull DynamoDB Local (differential oracle)
        run: docker pull amazon/dynamodb-local:latest
        timeout-minutes: 4
      - name: Run AWS SDK tests
        run: |
          cd simulators/aws
          sudo env "PATH=$PATH" "HOME=$HOME" GOWORK=off \
            SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/aws-spec-violations.jsonl" \
            SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/aws" \
            make sdk-test SDK_TEST_TIMEOUT=600s
        # The suite grows as services reach full op-coverage; give the step
        # headroom over the inner go-test deadline (SDK_TEST_TIMEOUT) so a hung
        # test fails with a named Go stack rather than an opaque step kill.
        timeout-minutes: 12
        env:
          GOWORK: "off"
      - name: Spec-shape ratchet (aws sdk)
        run: bash scripts/check-spec-violations.sh aws "$RUNNER_TEMP/aws-spec-violations.jsonl"

  sim-aws-cli:
    name: sim (aws cli ${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: edge
            run: '^Test(ACM|Amplify|APIGateway|ApplicationAutoScaling|AutoScaling|Batch|CloudFront|CloudTrail|CodeBuild|ELBv2|Glue)'
            timeout: 1200s
            timeout_minutes: 20
          - suite: ec2
            run: '^Test(EC2)'
            timeout: 1500s
            timeout_minutes: 27
          - suite: compute
            run: '^Test(CloudMap|DynamoDB|CLI_ECR|ECR|ECS|EFS|Logs)'
            timeout: 1200s
            timeout_minutes: 20
          - suite: appdata
            run: '^Test(CloudWatch|EventBridge|IAM|Kinesis|KMS|Lambda|ElastiCache|Organizations|RDS|ResourceTags)'
            timeout: 1200s
            timeout_minutes: 20
          - suite: appdata2
            run: '^Test(Route53|S3|Scheduler|SecretsManager|SFN|SNS|SQS|SSM|STS|WAFv2)'
            timeout: 1200s
            timeout_minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/sockerless/firecracker-ci
          key: firecracker-ci-${{ env.FIRECRACKER_VERSION }}-${{ runner.arch }}
      - name: Install real-execution tools
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y curl e2fsprogs iproute2 iputils-ping nftables procps squashfs-tools
          bash scripts/install-firecracker.sh
      - name: Install Session Manager plugin
        run: |
          curl -fsSLo /tmp/session-manager-plugin.deb https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version
      - name: Install latest AWS CLI v2
        # The ubuntu-runner-bundled aws CLI lags; newer service operations (e.g.
        # ECS Express Mode, launched 2025-11-21) need a current CLI. Install the
        # latest v2 so the cli-tests exercise every operation for real.
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q -o /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          hash -r
          aws --version
      - name: Run AWS CLI tests
        run: |
          bash scripts/ci-go-mod-download.sh simulators/aws
          cd simulators/aws
          sudo env "PATH=$PATH" "HOME=$HOME" GOWORK=off \
            SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/aws-cli-spec-violations.jsonl" \
            SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/aws" \
            make cli-test CLI_TEST_TIMEOUT=${{ matrix.timeout }} CLI_TEST_ARGS="-run '${{ matrix.run }}' ./..."
        timeout-minutes: ${{ matrix.timeout_minutes }}
        env:
          GOWORK: "off"
      - name: Spec-shape ratchet (aws cli ${{ matrix.suite }})
        run: bash scripts/check-spec-violations.sh aws "$RUNNER_TEMP/aws-cli-spec-violations.jsonl"

  tf:
    # Stock hashicorp/aws / hashicorp/google / hashicorp/azurerm
    # providers run against the sim binary via `terraform init` +
    # `terraform apply -auto-approve`. Exercises the provider's
    # call-sequence shape, which differs materially from the SDK's
    # (every recent reopen surfaced
    # against a provider sequence that the SDK tests had already
    # marked green).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure]
    name: tf (${{ matrix.cloud }})
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/sockerless/firecracker-ci
          key: firecracker-ci-${{ env.FIRECRACKER_VERSION }}-${{ runner.arch }}
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false
      - name: Install real-execution tools
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y curl e2fsprogs iproute2 iputils-ping nftables procps squashfs-tools
          bash scripts/install-firecracker.sh
      - name: Install Caddy
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y debian-keyring debian-archive-keyring apt-transport-https curl
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
          sudo chmod o+r /usr/share/keyrings/caddy-stable-archive-keyring.gpg /etc/apt/sources.list.d/caddy-stable.list
          bash scripts/ci-apt-update.sh
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y caddy
      - name: Run terraform tests
        run: |
          cd simulators/${{ matrix.cloud }}
          export SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/${{ matrix.cloud }}-tf-spec-violations.jsonl"
          export SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/${{ matrix.cloud }}"
          if [ "${{ matrix.cloud }}" = "aws" ]; then
            sudo env "PATH=$PATH" "HOME=$HOME" GOWORK=off \
              SOCKERLESS_SPEC_VALIDATE="$SOCKERLESS_SPEC_VALIDATE" SOCKERLESS_SPEC_DIR="$SOCKERLESS_SPEC_DIR" \
              make terraform-https-test TERRAFORM_TEST_TIMEOUT=600s
          elif [ "${{ matrix.cloud }}" = "azure" ]; then
            sudo env "PATH=$PATH" "HOME=$HOME" GOWORK=off \
              SOCKERLESS_SPEC_VALIDATE="$SOCKERLESS_SPEC_VALIDATE" SOCKERLESS_SPEC_DIR="$SOCKERLESS_SPEC_DIR" \
              make terraform-test TERRAFORM_TEST_TIMEOUT=600s
          else
            sudo env "PATH=$PATH" "HOME=$HOME" GOWORK=off \
              SOCKERLESS_SPEC_VALIDATE="$SOCKERLESS_SPEC_VALIDATE" SOCKERLESS_SPEC_DIR="$SOCKERLESS_SPEC_DIR" \
              make terraform-https-test
          fi
        # Must exceed the inner go-test deadline (TERRAFORM_TEST_TIMEOUT, 600s)
        # plus docker startup so the step never beats the test's own watchdog.
        timeout-minutes: 12
      - name: Spec-shape ratchet (tf)
        run: bash scripts/check-spec-violations.sh ${{ matrix.cloud }} "$RUNNER_TEMP/${{ matrix.cloud }}-tf-spec-violations.jsonl"
        env:
          GOWORK: "off"

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3'
      - run: cd ui && bun install --frozen-lockfile
      - run: cd ui && bunx turbo run build
      - run: cd ui && bunx turbo run typecheck
      - run: cd ui && bunx turbo run test

  bleephub-quality:
    name: bleephub (dead code + copy-paste)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3'
      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@latest
      - name: Install dupl
        run: go install github.com/mibk/dupl@latest
      - name: Install UI deps
        run: cd ui/packages/bleephub && bun install --frozen-lockfile
      - name: bleephub deadcode
        run: bash scripts/bleephub-deadcode.sh
      - name: bleephub dupl (Go ≥200 tokens)
        run: bash scripts/bleephub-dupl.sh
      - name: bleephub knip (dead TS exports)
        run: bash scripts/bleephub-knip.sh
      - name: bleephub jscpd (UI ≥200 tokens)
        run: bash scripts/bleephub-jscpd.sh

  simulators-quality:
    name: simulators (dead code + copy-paste)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3'
      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@latest
      - name: Install dupl
        run: go install github.com/mibk/dupl@latest
      - name: Install UI deps
        run: cd ui && bun install --frozen-lockfile
      - name: simulators deadcode
        run: bash scripts/simulators-deadcode.sh
      - name: simulators dupl (Go ≥200 tokens)
        run: bash scripts/simulators-dupl.sh
      - name: simulators knip (dead TS exports)
        run: bash scripts/simulators-knip.sh
      - name: simulators jscpd (UI ≥200 tokens)
        run: bash scripts/simulators-jscpd.sh

  bleephub-end-to-end:
    name: Bleephub end-to-end
    runs-on: ubuntu-latest
    # 15 (not 10): the chromium download in "Install Playwright browsers" is a
    # variable-time network step that, stacked on the UI + Go builds, used to
    # push a slow run past a 10-min wall mid-install — GitHub reports that as a
    # "cancelled" job. The browser cache below makes the install near-instant on
    # a hit; the headroom covers a cold cache.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3'
      - name: Build bleephub UI
        run: cd ui && bun install --frozen-lockfile && bunx turbo run build --filter="*bleephub*"
      - name: Copy UI dist for embedding
        run: cp -r ui/packages/bleephub/dist bleephub/dist
      - name: Build bleephub binary
        run: cd bleephub && GOWORK=off go build -o /tmp/bleephub-server ./cmd/
      # Cache the chromium binary so it isn't a ~150MB download every run (the
      # variable-time step that previously hung the job). Keyed on the lockfile
      # so a @playwright/test version bump invalidates it; restore-keys keeps a
      # warm cache across other dep bumps, and `playwright install` re-downloads
      # only if the version differs.
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      # System deps (apt) run UNGUARDED, in their own step: `install-deps` runs
      # `sudo apt-get`, and wrapping it in a kill-`timeout` corrupts dpkg if it's
      # killed mid-transaction (a prior version did exactly that — attempt 1
      # timed out in apt, leaving the lock held, so retries failed instantly with
      # apt exit 100). On GitHub runners most of these libs are pre-installed, so
      # this is fast; a rare apt hang falls to the job timeout, not a wedged dpkg.
      - name: Install Playwright system deps
        run: cd ui/packages/bleephub && npx playwright install-deps chromium
      # The chromium binary download IS the variable-network step the cache
      # covers; bound it with `timeout` + retry. Killing a download mid-flight is
      # safe (no dpkg/apt state), unlike killing apt above. On a cache hit this
      # is a fast no-op.
      - name: Install Playwright chromium
        run: |
          cd ui/packages/bleephub
          for attempt in 1 2 3; do
            if timeout 180 npx playwright install chromium; then
              exit 0
            fi
            echo "::warning::playwright chromium download attempt ${attempt} failed; retrying"
            sleep 5
          done
          echo "::error::playwright chromium download failed after 3 attempts"
          exit 1
      - name: Run Playwright E2E tests
        run: cd ui/packages/bleephub && SERVER_BIN=/tmp/bleephub-server npx playwright test --timeout=60000
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-screenshots
          path: temp/screenshots/
          retention-days: 7

  # bleephub against the official GitHub Go SDK (google/go-github): builds the
  # binary, runs it, and drives every major surface through typed SDK calls so
  # any wire-shape drift surfaces as a decode error.
  bleephub-github-software-development-kit:
    name: Bleephub GitHub software development kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: go-github SDK tests
        run: cd bleephub/sdk-tests && GOWORK=off CGO_ENABLED=0 go test -v -timeout 8m ./...

  # bleephub against the real `gh` CLI inside Docker (self-signed TLS + CA
  # trust + the official gh binary driving repo/issue/PR/release verbs).
  bleephub-github-command-line-interface:
    name: Bleephub GitHub command-line interface
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.0
      - name: gh CLI parity harness (Docker)
        run: make bleephub-gh-docker-test

  # The official actions/runner registering against bleephub and running
  # real jobs end-to-end: host-mode jobs, container-mode jobs +
  # service containers dispatched through sockerless-backend-ecs to the
  # AWS simulator (workloads on the host engine via the mounted docker.sock,
  # workspace shared via simulator-backed Amazon Elastic File System), and the
  # github-runner dispatcher
  # spawning an ephemeral runner for a queued job (runner-as-cloud-task
  # topology, sim-proven).
  bleephub-github-actions-runner:
    name: Bleephub GitHub Actions runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Official runner integration harness (Docker)
        run: make bleephub-runner-docker-test

  build-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Check backend api.Backend coverage
        run: cd tools/check-backend-coverage && GOWORK=off go run . --enforce
        timeout-minutes: 5
      - name: Check simulator SDK/CLI/Terraform coverage matrix
        run: bash scripts/check-simulator-coverage-matrix.sh
        timeout-minutes: 5

  build-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Build all binaries (amd64)
        timeout-minutes: 10
        env:
          GOWORK: "off"
        run: |
          set -e
          build() { echo "=== $1 ===" && (cd "$1" && go build -o /dev/null "$2"); }
          noui() { echo "=== $1 (noui) ===" && (cd "$1" && go build -tags noui -o /dev/null "$2"); }
          noui bleephub ./cmd
          build cmd/sockerless .
          build agent ./cmd/sockerless-agent
          noui backends/ecs ./cmd/sockerless-backend-ecs
          noui backends/lambda ./cmd/sockerless-backend-lambda
          noui backends/cloudrun ./cmd/sockerless-backend-cloudrun
          noui backends/cloudrun-functions ./cmd/sockerless-backend-gcf
          noui backends/aca ./cmd/sockerless-backend-aca
          noui backends/azure-functions ./cmd/sockerless-backend-azf
          noui backends/docker ./cmd
          noui simulators/aws .
          noui simulators/gcp .
          noui simulators/azure .
          noui cmd/sockerless-admin .
          build github-runner-dispatcher-aws ./cmd/github-runner-dispatcher-aws
          build github-runner-dispatcher-gcp ./cmd/github-runner-dispatcher-gcp
          build github-runner-dispatcher-azure ./cmd/github-runner-dispatcher-azure

  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Cross-compile all binaries (arm64)
        timeout-minutes: 10
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          set -e
          build() { echo "=== $1 ===" && (cd "$1" && go build -o /dev/null "$2"); }
          noui() { echo "=== $1 (noui) ===" && (cd "$1" && go build -tags noui -o /dev/null "$2"); }
          noui bleephub ./cmd
          build cmd/sockerless .
          build agent ./cmd/sockerless-agent
          noui backends/ecs ./cmd/sockerless-backend-ecs
          noui backends/lambda ./cmd/sockerless-backend-lambda
          noui backends/cloudrun ./cmd/sockerless-backend-cloudrun
          noui backends/cloudrun-functions ./cmd/sockerless-backend-gcf
          noui backends/aca ./cmd/sockerless-backend-aca
          noui backends/azure-functions ./cmd/sockerless-backend-azf
          noui backends/docker ./cmd
          noui simulators/aws .
          noui simulators/gcp .
          noui simulators/azure .
          noui cmd/sockerless-admin .
          build github-runner-dispatcher-aws ./cmd/github-runner-dispatcher-aws
          build github-runner-dispatcher-gcp ./cmd/github-runner-dispatcher-gcp
          build github-runner-dispatcher-azure ./cmd/github-runner-dispatcher-azure

  smoke:
    # Native linux/arm64 CPU architecture — simulator primary capacity.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Smoke test (ecs)
        run: |
          docker build -t smoke-ecs -f smoke-tests/Dockerfile.ecs .
          docker run --rm --security-opt label=disable -v /var/run/docker.sock:/var/run/docker.sock smoke-ecs
        timeout-minutes: 5
      - name: Smoke test (cloudrun)
        run: |
          docker build -t smoke-cloudrun -f smoke-tests/Dockerfile.cloudrun .
          docker run --rm --security-opt label=disable -v /var/run/docker.sock:/var/run/docker.sock smoke-cloudrun
        timeout-minutes: 5
      - name: Smoke test (aca)
        run: |
          docker build -t smoke-aca -f smoke-tests/Dockerfile.aca .
          docker run --rm --security-opt label=disable -v /var/run/docker.sock:/var/run/docker.sock smoke-aca
        timeout-minutes: 5

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: hashicorp/setup-terraform@v4.0.1
      - name: Run terraform tests
        run: |
          cd terraform/modules/ecs/test
          GOWORK=off go test -v -timeout 5m ./...
        timeout-minutes: 5
