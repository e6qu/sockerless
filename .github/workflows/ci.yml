name: CI

env:
  GO_CACHE_DEPENDENCY_PATHS: |
    go.work
    **/go.sum

on:
  pull_request:
    branches: [main]
  # Reusable from release.yml so tag pushes get full PR-level CI.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint-go:
    name: lint (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core-local
            modules: cmd/sockerless cmd/sockerless-admin agent backends/docker
            timeout_minutes: 5
          - shard: cloud-backends-aws
            modules: backends/aws-common backends/ecs backends/lambda
            timeout_minutes: 5
          - shard: cloud-backends-gcp
            modules: backends/cloudrun backends/cloudrun-functions
            timeout_minutes: 5
          - shard: cloud-backends-azure
            modules: backends/aca backends/azure-functions
            timeout_minutes: 5
          - shard: dispatchers
            modules: github-runner-dispatcher-aws github-runner-dispatcher-gcp github-runner-dispatcher-azure
            timeout_minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Install golangci-lint
        run: |
          set -o pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 180 https://golangci-lint.run/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
      - name: Lint
        run: |
          set -e
          for module in ${{ matrix.modules }}; do
            echo "=== $module ==="
            make "$module/lint"
          done
        timeout-minutes: ${{ matrix.timeout_minutes }}

  check-deps:
    name: check-deps (deps + actions + scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Install script check tools
        run: bash scripts/ci-apt-update.sh && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y jq shellcheck zsh
      - name: Check shell scripts
        run: |
          shellcheck -x -s bash scripts/*.sh
          bash -n scripts/*.sh
          zsh -n scripts/*.sh
      - name: Check smoke Docker build contexts
        run: bash scripts/check-smoke-build-contexts.sh
      - name: Check container publication contract
        run: bash scripts/check-container-publication.sh
      # The Actions half of this check reads the GitHub API. Unauthenticated
      # requests are rate limited, and a throttled reply is indistinguishable
      # from "this action has no newer tag", so the token is passed explicitly
      # rather than left to whatever quota the runner happens to have.
      - name: Check dependency freshness (bash)
        run: bash scripts/check-latest-deps.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check dependency freshness (zsh)
        run: zsh scripts/check-latest-deps.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  single-open-pr:
    name: At most one PR open
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: At most one PR open
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-single-open-pr.sh

  # rebased-on-main: fail if the PR branch has fallen behind origin/main, so
  # every PR is tested (and merges) on top of the latest base.
  rebased-on-main:
    name: Branch rebased on origin/main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Branch must be rebased on origin/main
        run: bash scripts/check-rebased-on-main.sh

  # test-core: fast unit + library tests, no Docker integration.
  # Split out so flakes in per-backend integration don't restart the
  # whole monolith. Each package keeps its own bounded deadline so the
  # core packages retain bounded native ARM64 test deadlines.
  test-core:
    name: test (core)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Architecture checks
        run: bash scripts/check-cloud-backend-isolation.sh
      - name: Core + API + agent
        run: |
          set -e
          run() { echo "=== $1 ===" && (cd "$1" && go test -tags noui -v -timeout 5m ./...); }
          run_noflags() { echo "=== $1 ===" && (cd "$1" && go test -v -timeout 5m ./...); }
          run_race() { echo "=== $1 ===" && (cd "$1" && go test -v -race -timeout 5m ./...); }
          run_work() { echo "=== $1 ===" && (cd "$1" && GOWORK=off go test -v -timeout 5m ./...); }
          run_noflags api
          run backends/core
          run_race agent
          run backends/aws-common
          run backends/gcp-common
          run backends/azure-common
          run cmd/sockerless-admin

  # test-backend: grouped backend integration tests. Each shard runs
  # real simulator-backed Docker integration tests for related backends.
  # FaaS smoke tests are skipped here (`-skip FaaSE2ESmoke`) and run
  # in `test-faas-smoke` below.
  test-backend:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      SOCKERLESS_TEST_TARGET: "sim"
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: aws backends
            backends: ecs lambda
          - shard: gcp backends
            backends: cloudrun cloudrun-functions
          - shard: azure backends
            backends: aca azure-functions
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Verify docker available
        run: docker version && docker info
      - name: Integration tests for ${{ matrix.shard }}
        run: |
          set -e
          for backend in ${{ matrix.backends }}; do
            echo "=== $backend ==="
            cd "backends/$backend"
            # ECS doesn't have FaaS smoke tests; skip flag is a no-op there.
            go test -tags 'noui integration' -v -skip 'FaaSE2ESmoke' -timeout 5m ./...
            cd ../..
          done

  # test-faas-smoke: grouped FaaS smoke matrix. These tests exercise
  # the runner-shaped lifecycle (create → start → exec×N → signal →
  # wait → remove) against real simulator-backed backends.
  test-faas-smoke:
    name: test (${{ matrix.shard }} faas-smoke)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      SOCKERLESS_TEST_TARGET: "sim"
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: aws-gcp
            backends: lambda cloudrun
          - shard: gcp-azure
            backends: gcf aca
          - shard: azure-functions
            backends: azf
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Verify docker available
        run: docker version && docker info
      - name: FaaS smoke for ${{ matrix.shard }}
        run: |
          set -e
          for backend in ${{ matrix.backends }}; do
            echo "=== $backend ==="
            make "faas-smoke-test-$backend"
          done

  test-e2e:
    # Native linux/arm64 CPU architecture, matching the simulator
    # capacity contract without QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    name: test (e2e)
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Run tests
        # A stop on the Amazon ECS simulator now waits the container's
        # ten-second grace, as it does on Docker and ECS, so the suite runs
        # longer than the two and a half minutes it took when the simulator
        # stopped a task at once.
        run: cd tests && go test -v -timeout 10m ./...

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # A one-shot run on a fresh checkout has no use for turbo's background
    # daemon, and a build step has no business making a telemetry request: both
    # are work that can block without producing output, on a job whose real
    # work takes about two minutes. Each turbo step also carries its own
    # timeout, so a step that stops making progress is reported as the step it
    # stopped in rather than as the whole job running out of time.
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3'
      - run: cd ui && bun install --frozen-lockfile
        timeout-minutes: 3
      - run: cd ui && bunx turbo run build --no-daemon
        timeout-minutes: 4
      - run: cd ui && bunx turbo run typecheck --no-daemon
        timeout-minutes: 4
      - run: cd ui && bunx turbo run test --no-daemon
        timeout-minutes: 6

  ui-browser:
    name: browser (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - admin
          - backend-docker
          - backend-ecs
          - backend-lambda
          - backend-cloudrun
          - backend-gcf
          - backend-aca
          - backend-azf
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3'
      - run: cd ui && bun install --frozen-lockfile
      # The browser binaries are cached because the only thing between this job
      # and the network is a 177 MiB download that the lockfile pins exactly.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
      # Deliberately not --with-deps. The runner image already carries every
      # library Chromium links against — a --with-deps run reports all of them
      # "already the newest version" — so the only packages it adds are nine
      # CJK, Thai and Cyrillic font packages no browser test renders. Fetching
      # them cost 10min 22s at 33.9 kB/s on one run, which overran the job
      # budget and cancelled the tests. A missing library, if the image ever
      # drops one, fails loudly at browser launch naming what is absent.
      - run: cd ui && bunx playwright install chromium
        timeout-minutes: 5
      - run: cd "ui/packages/${{ matrix.package }}" && bun run test:e2e

  sso-browser:
    name: browser (Shauth relying parties)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: e6qu/shauth
          ref: 0fda680cba964e5768ed75a9c3e5b7230c418ca6
          path: .test-deps/shauth
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: '.test-deps/shauth/go.mod'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3'
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: cd ui && bun install --frozen-lockfile
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
      # See the note in ui-browser: --with-deps adds only font packages here,
      # and fetching them is what overran this job's budget.
      - run: cd ui && bunx playwright install chromium
        timeout-minutes: 5
      - run: SHAUTH_SOURCE_DIR="$GITHUB_WORKSPACE/.test-deps/shauth" bash scripts/test-shauth-rps.sh

  build-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Check backend api.Backend coverage
        run: cd tools/check-backend-coverage && GOWORK=off go run . --enforce
        timeout-minutes: 5
      - name: Required status checks stay emittable
        run: bash scripts/check-required-status-checks.sh
        timeout-minutes: 5

  build-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Build all binaries (amd64)
        timeout-minutes: 10
        env:
          GOWORK: "off"
        run: |
          set -e
          build() { echo "=== $1 ===" && (cd "$1" && go build -o /dev/null "$2"); }
          noui() { echo "=== $1 (noui) ===" && (cd "$1" && go build -tags noui -o /dev/null "$2"); }
          build cmd/sockerless .
          build agent ./cmd/sockerless-agent
          noui backends/ecs ./cmd/sockerless-backend-ecs
          noui backends/lambda ./cmd/sockerless-backend-lambda
          noui backends/cloudrun ./cmd/sockerless-backend-cloudrun
          noui backends/cloudrun-functions ./cmd/sockerless-backend-gcf
          noui backends/aca ./cmd/sockerless-backend-aca
          noui backends/azure-functions ./cmd/sockerless-backend-azf
          noui backends/docker ./cmd
          noui cmd/sockerless-admin .
          build github-runner-dispatcher-aws ./cmd/github-runner-dispatcher-aws
          build github-runner-dispatcher-gcp ./cmd/github-runner-dispatcher-gcp
          build github-runner-dispatcher-azure ./cmd/github-runner-dispatcher-azure

  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Cross-compile all binaries (arm64)
        timeout-minutes: 10
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          set -e
          build() { echo "=== $1 ===" && (cd "$1" && go build -o /dev/null "$2"); }
          noui() { echo "=== $1 (noui) ===" && (cd "$1" && go build -tags noui -o /dev/null "$2"); }
          build cmd/sockerless .
          build agent ./cmd/sockerless-agent
          noui backends/ecs ./cmd/sockerless-backend-ecs
          noui backends/lambda ./cmd/sockerless-backend-lambda
          noui backends/cloudrun ./cmd/sockerless-backend-cloudrun
          noui backends/cloudrun-functions ./cmd/sockerless-backend-gcf
          noui backends/aca ./cmd/sockerless-backend-aca
          noui backends/azure-functions ./cmd/sockerless-backend-azf
          noui backends/docker ./cmd
          noui cmd/sockerless-admin .
          build github-runner-dispatcher-aws ./cmd/github-runner-dispatcher-aws
          build github-runner-dispatcher-gcp ./cmd/github-runner-dispatcher-gcp
          build github-runner-dispatcher-azure ./cmd/github-runner-dispatcher-azure

  smoke:
    # Native linux/arm64 CPU architecture — simulator primary capacity.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      # Host networking: the simulator inside the smoke container serves its
      # registry at its own loopback address, and the host daemon that runs
      # the workloads must reach that same loopback to pull from it.
      - name: Smoke test (ecs)
        run: |
          docker build -t smoke-ecs -f smoke-tests/Dockerfile.ecs .
          docker run --rm --network host --security-opt label=disable -v /var/run/docker.sock:/var/run/docker.sock smoke-ecs
        timeout-minutes: 5
      - name: Smoke test (cloudrun)
        run: |
          docker build -t smoke-cloudrun -f smoke-tests/Dockerfile.cloudrun .
          docker run --rm --network host --security-opt label=disable -v /var/run/docker.sock:/var/run/docker.sock smoke-cloudrun
        timeout-minutes: 5
      - name: Smoke test (aca)
        run: |
          docker build -t smoke-aca -f smoke-tests/Dockerfile.aca .
          docker run --rm --network host --security-opt label=disable -v /var/run/docker.sock:/var/run/docker.sock smoke-aca
        timeout-minutes: 5

  # terraform-integration: applies a deployable Terraform environment against
  # its simulator with the credential the harness mints, starts the backend on
  # the outputs, and runs the act smoke workflow through it — the Terraform
  # modules' apply against the simulators is proven nowhere else.
  terraform-integration:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The Lambda cell returns when the simulator's Lambda host pulls
        # its image from the simulator's own ECR, where the pull-through cache
        # serves it, instead of resolving the cached reference to a local
        # name the engine does not hold.
        backend: [ecs, cloudrun, gcf, aca, azf]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Terraform integration (${{ matrix.backend }})
        run: make tf-int-test-${{ matrix.backend }}
        timeout-minutes: 14

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: hashicorp/setup-terraform@v4.0.1
      - name: Run terraform tests
        run: |
          cd terraform/modules/ecs/test
          GOWORK=off go test -v -timeout 5m ./...
        timeout-minutes: 5
