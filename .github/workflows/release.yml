name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  test-gate:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.25'
          cache: true
      - name: Bleephub unit tests
        # -tags noui: the embedded UI (//go:embed all:dist) needs a built
        # dist/, which is gitignored and not built in this job. The unit
        # tests don't exercise the embed, so build them without it (matches
        # the test-core job in ci.yml).
        run: cd bleephub && go test -tags noui -v -timeout 3m ./...
      - name: Simulator integration tests
        run: |
          cd tests && go test -v -timeout 5m ./...

  release:
    needs: test-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.25'
          cache: true
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7.2.2
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOWORK: "off"
