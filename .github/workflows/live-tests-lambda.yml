# live-tests-lambda — sockerless Lambda backend, against a real AWS account.
#
# Manual only (`workflow_dispatch`). Brings up the AWS Lambda infrastructure,
# runs API differentials and the backend baseline, and
# tears everything down. Teardown always runs so a failed earlier job
# still releases scratch AWS resources. See smoke-tests/aws-live/README.md
# for the scripts each job runs.
#
# REQUIRED REPOSITORY SECRETS (Settings → Secrets and variables →
# Actions). These MUST be configured before dispatch — the workflow
# will fail at the first credentials step otherwise:
#
#   AWS_LIVE_ROLE_ARN          — IAM role ARN that GitHub OIDC assumes.
# Why repo secrets and not workflow inputs: see live-tests-ecs.yml.

name: live-tests-lambda

on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region (e.g. eu-west-1)
        required: true
        default: eu-west-1
      scripts:
        description: 'Comma-separated steps: 0=infra,api=real-AWS API differential,2=lambda-baseline,6=teardown ("all" runs the full chain)'
        required: true
        default: "all"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  infra-up:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: contains(fromJSON(format('["all","{0}"]', inputs.scripts)), 'all') || contains(inputs.scripts, '0')
    env:
      AWS_REGION: ${{ inputs.region }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_LIVE_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - uses: hashicorp/setup-terraform@v4.0.1
      - name: Provision shared Amazon ECS infrastructure
        run: |
          TG_DIR=terraform/environments/ecs/live \
          INFRA_OUTPUT=/tmp/ecs-infra-out.json \
          bash smoke-tests/aws-live/0-infra-up.sh
      - name: Provision AWS Lambda infrastructure
        run: |
          TG_DIR=terraform/environments/lambda/live \
          INFRA_OUTPUT=/tmp/aws-infra-out.json \
          bash smoke-tests/aws-live/0-infra-up.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: lambda-outputs
          path: /tmp/aws-infra-out.json

  api-conformance:
    needs: infra-up
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: contains(fromJSON(format('["all","{0}"]', inputs.scripts)), 'all') || contains(inputs.scripts, 'api')
    env:
      AWS_REGION: ${{ inputs.region }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_LIVE_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - uses: actions/download-artifact@v8.0.1
        with: { name: lambda-outputs, path: /tmp }
      # The differential suites live in the sockerless-cloud repository (the
      # sim SDK tests double as live-cloud conformance tests — same code,
      # only the coordinates differ). Pin the revision so live runs are
      # reproducible; bump the ref together with the sim dependency.
      - uses: actions/checkout@v7.0.1
        with:
          repository: e6qu/sockerless-cloud
          ref: v0.9.2
          path: .test-deps/sockerless-cloud
      - name: Differential against real AWS Lambda and AWS Step Functions
        run: |
          export AWS_LIVE_LAMBDA_ROLE_ARN
          export AWS_LIVE_SFN_ROLE_ARN
          AWS_LIVE_LAMBDA_ROLE_ARN="$(jq -r '.execution_role_arn.value' /tmp/aws-infra-out.json)"
          AWS_LIVE_SFN_ROLE_ARN="$(jq -r '.step_functions_conformance_role_arn.value' /tmp/aws-infra-out.json)"
          cd .test-deps/sockerless-cloud/simulator-aws/sdk-tests
          go test -tags 'noui liveaws' -run 'Test(SFNTestState|SFNExecutionHistory|SFNLambdaTaskHistory|SFNControlPlane|SFNNestedWorkflow|SFNDistributedMap|LambdaZIPAndLayer|LambdaVersionAlias)DifferentialAgainstAWS' ./...

  lambda-baseline:
    needs: infra-up
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: contains(fromJSON(format('["all","{0}"]', inputs.scripts)), 'all') || contains(inputs.scripts, '2')
    env:
      AWS_REGION: ${{ inputs.region }}
      AWS_INFRA_OUTPUT: /tmp/aws-infra-out.json
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_LIVE_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - uses: actions/download-artifact@v8.0.1
        with: { name: lambda-outputs, path: /tmp }
      - run: (cd backends/lambda && go build -o ../../sockerless-backend-lambda ./cmd/sockerless-backend-lambda)
      - run: bash smoke-tests/aws-live/2-lambda-baseline.sh

  teardown:
    needs: [api-conformance, lambda-baseline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ inputs.region }}
      TG_DIR: terraform/environments/ecs/live
      EXTRA_TG_DIR: terraform/environments/lambda/live
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_LIVE_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - uses: hashicorp/setup-terraform@v4.0.1
      - run: bash smoke-tests/aws-live/6-teardown.sh
