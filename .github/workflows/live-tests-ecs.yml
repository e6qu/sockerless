# live-tests-ecs — sockerless ECS backend, against a real AWS account.
#
# Manual only (`workflow_dispatch`). Brings up the shared AWS infra
# (terraform), runs the ECS smoke, registers real github.com and gitlab.com
# runners through the Amazon ECS backend, then tears everything down. Teardown always runs so a
# failed earlier job still releases scratch AWS resources. See
# smoke-tests/aws-live/README.md for the scripts each job runs.
#
# REQUIRED REPOSITORY SECRETS (Settings → Secrets and variables →
# Actions). These MUST be configured before dispatch — the workflow
# will fail at the first credentials step otherwise:
#
#   AWS_LIVE_ROLE_ARN           — IAM role ARN that GitHub OIDC assumes.
#                                 Trust policy allows
#                                 token.actions.githubusercontent.com
#                                 with this repo's ref claim.
#   AWS_LIVE_GITHUB_PAT         — PAT with repository administration scope
#                                 for 4-github-runner.sh.
#   AWS_LIVE_GITLAB_RUNNER_TOKEN — GitLab runner authentication token for
#                                  5-gitlab-runner.sh.
#
# Why repo secrets and not workflow inputs: workflow_dispatch inputs
# leak into the run history's Inputs panel and the workflow run REST
# API, so they're not safe for credentials. Repo secrets are masked in
# logs and never returned by the API. Mirror the same secret names in
# the GitLab mirror's CI/CD variables if running this workflow there.

name: live-tests-ecs

on:
  workflow_dispatch:
    inputs:
      region:
        # The live environments pin their region in Terraform (provider,
        # availability zones, and state bucket), so it is the only choice.
        description: AWS region of the live environments
        type: choice
        options: [eu-west-1]
        required: true
        default: eu-west-1
      scripts:
        description: 'Comma-separated steps: 0=infra,1=ecs-smoke,4=github-runner,5=gitlab-runner,hello,6=teardown ("all" runs the full chain)'
        required: true
        default: "all"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  infra-up:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.scripts == 'all' || contains(format(',{0},', inputs.scripts), ',0,')
    env:
      AWS_REGION: ${{ inputs.region }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_LIVE_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - uses: hashicorp/setup-terraform@v4.0.1
      - name: Install Terragrunt
        # The release binary, checked against the release's own SHA256SUMS.
        run: |
          version=v0.77.22
          url="https://github.com/gruntwork-io/terragrunt/releases/download/$version"
          curl -fsSL "$url/terragrunt_linux_amd64" -o "$RUNNER_TEMP/terragrunt"
          curl -fsSL "$url/SHA256SUMS" | grep ' terragrunt_linux_amd64$' | sed "s| terragrunt_linux_amd64$| $RUNNER_TEMP/terragrunt|" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/terragrunt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: bash smoke-tests/aws-live/0-infra-up.sh
        env:
          INFRA_OUTPUT: /tmp/ecs-out.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ecs-outputs
          path: /tmp/ecs-out.json

  ecs-smoke:
    needs: infra-up
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.scripts == 'all' || contains(format(',{0},', inputs.scripts), ',1,')
    env:
      AWS_REGION: ${{ inputs.region }}
      # The Fargate tasks' CPU architecture, the module's default platform.
      SOCKERLESS_ECS_CPU_ARCHITECTURE: X86_64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_LIVE_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - uses: actions/download-artifact@v8.0.2
        with: { name: ecs-outputs, path: /tmp }
      - run: (cd backends/ecs && go build -tags noui -o ../../sockerless-backend-ecs ./cmd/sockerless-backend-ecs)
      - run: bash smoke-tests/aws-live/1-ecs-smoke.sh

  github-runner:
    needs: infra-up
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.scripts == 'all' || contains(format(',{0},', inputs.scripts), ',4,')
    env:
      AWS_REGION: ${{ inputs.region }}
      # The Fargate tasks' CPU architecture, the module's default platform.
      SOCKERLESS_ECS_CPU_ARCHITECTURE: X86_64
      GITHUB_PAT: ${{ secrets.AWS_LIVE_GITHUB_PAT }}
      GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_LIVE_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - uses: actions/download-artifact@v8.0.2
        with: { name: ecs-outputs, path: /tmp }
      - run: (cd backends/ecs && go build -tags noui -o ../../sockerless-backend-ecs ./cmd/sockerless-backend-ecs)
      - run: bash smoke-tests/aws-live/4-github-runner.sh

  gitlab-runner:
    needs: infra-up
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.scripts == 'all' || contains(format(',{0},', inputs.scripts), ',5,')
    env:
      AWS_REGION: ${{ inputs.region }}
      # The Fargate tasks' CPU architecture, the module's default platform.
      SOCKERLESS_ECS_CPU_ARCHITECTURE: X86_64
      GITLAB_RUNNER_TOKEN: ${{ secrets.AWS_LIVE_GITLAB_RUNNER_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_LIVE_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - uses: actions/download-artifact@v8.0.2
        with: { name: ecs-outputs, path: /tmp }
      - run: (cd backends/ecs && go build -tags noui -o ../../sockerless-backend-ecs ./cmd/sockerless-backend-ecs)
      - run: bash smoke-tests/aws-live/5-gitlab-runner.sh

  hello:
    # Minimal sanity check that the github.com Actions runner + sockerless-ecs
    # backend wiring works end-to-end. Runs on the self-hosted runner
    # registered by `github-runner` above.
    needs: github-runner
    if: inputs.scripts == 'all' || contains(format(',{0},', inputs.scripts), ',hello,')
    runs-on: [self-hosted, sockerless-ecs]
    timeout-minutes: 15
    container:
      image: alpine:latest
    steps:
      - run: echo "hello from sockerless ecs"
      - run: env | sort

  teardown:
    needs: [ecs-smoke, github-runner, gitlab-runner, hello]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ inputs.region }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_LIVE_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - uses: hashicorp/setup-terraform@v4.0.1
      - name: Install Terragrunt
        # The release binary, checked against the release's own SHA256SUMS.
        run: |
          version=v0.77.22
          url="https://github.com/gruntwork-io/terragrunt/releases/download/$version"
          curl -fsSL "$url/terragrunt_linux_amd64" -o "$RUNNER_TEMP/terragrunt"
          curl -fsSL "$url/SHA256SUMS" | grep ' terragrunt_linux_amd64$' | sed "s| terragrunt_linux_amd64$| $RUNNER_TEMP/terragrunt|" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/terragrunt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: bash smoke-tests/aws-live/6-teardown.sh
