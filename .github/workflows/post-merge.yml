name: Publish Bleephub container

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-bleephub-${{ github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/e6qu/sockerless-bleephub

jobs:
  metadata:
    name: Container tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        name: Derive short commit SHA tag
        env:
          SHA: ${{ github.sha }}
        run: echo "value=${SHA::12}" >> "$GITHUB_OUTPUT"

  build:
    name: Bleephub (${{ matrix.arch.suffix }})
    needs: metadata
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { platform: linux/amd64, runner: ubuntu-latest, suffix: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64 }
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish native architecture image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: bleephub/Dockerfile.release
          platforms: ${{ matrix.arch.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.metadata.outputs.tag }}-${{ matrix.arch.suffix }}
          cache-from: type=gha,scope=bleephub-${{ matrix.arch.suffix }}
          cache-to: type=gha,scope=bleephub-${{ matrix.arch.suffix }},mode=max

  manifest:
    name: Bleephub multi-architecture manifest
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
