name: Publish Bleephub container

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-bleephub-${{ github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/e6qu/sockerless-bleephub

jobs:
  metadata:
    name: Container tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        name: Derive short commit SHA tag
        env:
          SHA: ${{ github.sha }}
        run: echo "value=${SHA::12}" >> "$GITHUB_OUTPUT"

  build:
    name: Bleephub (${{ matrix.arch.suffix }})
    needs: metadata
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { platform: linux/amd64, runner: ubuntu-latest, suffix: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64 }
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish native architecture image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: bleephub/Dockerfile.release
          platforms: ${{ matrix.arch.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.metadata.outputs.tag }}-${{ matrix.arch.suffix }}
          cache-from: type=gha,scope=bleephub-${{ matrix.arch.suffix }}
          cache-to: type=gha,scope=bleephub-${{ matrix.arch.suffix }},mode=max

  manifest:
    name: Bleephub multi-architecture manifest
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"

  prune:
    name: Retain 20 Bleephub releases
    needs: [metadata, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Delete package versions outside the newest 20 releases
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: sockerless-bleephub
        run: |
          set -euo pipefail

          versions_file="$(mktemp)"
          package_owner_type="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.type')"
          case "$package_owner_type" in
            Organization) package_namespace="orgs" ;;
            User) package_namespace="users" ;;
            *)
              echo "::error::Unsupported GitHub package owner type: $package_owner_type"
              exit 1
              ;;
          esac
          gh api --paginate \
            "/$package_namespace/$OWNER/packages/container/$PACKAGE/versions?per_page=100" \
            | jq -s 'add' > "$versions_file"

          keep_tags="$({
            jq -r '
              [ .[]
                | select(any(.metadata.container.tags[]?; test("^[0-9a-f]{12}$")))
              ]
              | sort_by(.created_at)
              | reverse
              | .[:20]
              | .[]
              | .metadata.container.tags[]
              | select(test("^[0-9a-f]{12}$"))
            ' "$versions_file" \
              | while IFS= read -r tag; do
                  printf '%s\n' "$tag" "$tag-amd64" "$tag-arm64"
                done
          } | jq -R . | jq -s 'unique')"

          jq -r --argjson keep "$keep_tags" '
            .[] as $version
            | ($version.metadata.container.tags // []) as $tags
            | select(
                ($tags | length == 0)
                or (($tags | any(. as $tag; $keep | index($tag) != null)) | not)
              )
            | $version.id
          ' "$versions_file" \
            | while IFS= read -r version_id; do
                echo "Deleting obsolete package version $version_id"
                gh api --method DELETE \
                  "/$package_namespace/$OWNER/packages/container/$PACKAGE/versions/$version_id"
              done
